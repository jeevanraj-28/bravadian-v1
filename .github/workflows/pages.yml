# Test copy of the site on GitHub Pages (production stays on Vercel).
# Built for the "/bravadian-v1/" address and wired to the TEST Supabase project,
# so testing never touches live orders or products (add ?db=live to view the live catalog).
name: Deploy test copy to GitHub Pages

on:
  push:
    branches: [sridhar_28_added_secuirty_connection]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the test copy
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_DB: test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
